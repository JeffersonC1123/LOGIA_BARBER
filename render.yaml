services:
  - type: web
    name: logia-barber
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/barberia.db
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: logia-barber-data
      mountPath: /var/data
      sizeGB: 1